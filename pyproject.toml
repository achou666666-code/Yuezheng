[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuezheng"
version = "0.4.25"
description = "Yuezheng: Agent-led music production assistant for editable music projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
image = ["Pillow>=10", "PyMuPDF>=1.24"]
audio = ["numpy>=1.24", "matplotlib>=3.7"]
websocket = ["websockets>=12"]
test = ["pytest>=8"]

[project.scripts]
yuezheng = "yuezheng.cli:main"
scorebridge = "yuezheng.cli:main"

[tool.setuptools.package-data]
"yuezheng.musescore" = ["commands.js"]
"yuezheng.sibelius" = ["Yuezheng.plg.in"]
