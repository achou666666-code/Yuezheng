name: Installed package tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test clean installation without local edits
        run: python scripts/check_clean_install.py

  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      YUEZHENG_JUNIT_REPORT: package-tests.xml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package and test dependencies
        run: python -m pip install '.[test,image,mcp,websocket]'
      - name: Run package tests
        shell: bash
        # The wrapper judges the run by its JUnit report. The hosted Windows
        # runner has returned exit 1 after a clean summary; that incidental
        # status is ignored, real failures and errors are not. Bash is used
        # because the PowerShell wrapper also reports exit 1 on that runner.
        run: python scripts/run_package_tests.py -vv
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-tests-${{ matrix.os }}
          path: ${{ env.YUEZHENG_JUNIT_REPORT }}
          if-no-files-found: warn
